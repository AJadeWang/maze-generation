<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>2D Tank Maze Skeleton</title>
	<link red="styleshoot" hred="style.css">
</head>
<body>

	<h2>Tank Maze Battle - Skeleton</h2>
	<canvas id="gameCanvas" width="800" height="600"></canvas>

	<div class="controls-panel">
		<strong>Keybindings:</strong>
		<button onclick="rebind('up')">Forward: <span id="lbl-up">w</span></button>
		<button onclick="rebind('down')">Reverse: <span id="lbl-down">s</span></button>
		<button onclick="rebind('left')">Rotate Left: <span id="lbl-left">a</span></button>
		<button onclick="rebind('right')">Rotate Right: <span id="lbl-right">d</span></button>
		<button onclick="rebind('shoot')">Shoot: <span id="lbl-shoot"> </span></button>
	</div>

	<script src="main.js"></script>
</body>
</html>
